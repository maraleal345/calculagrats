<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#075985">
<title>Calculadora de Gratuidades</title>
<style>
:root{--bg:#ffffff;--soft:#effbfb;--card:#ffffff;--tx:#0b3b45;--mut:#5f8791;--bd:#cdeaec;--pri:#0fb5c4;--pri2:#0891a6;--acc:#0fb5c4;--err:#d92d20;--ok:#0f9d6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:Roboto,system-ui,sans-serif;background:var(--bg);color:var(--tx)}
.screen{min-height:100%;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 20px)}
.screen.on{display:flex}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.logo{width:92px;height:92px;margin-bottom:22px}
.btns{padding-bottom:24px}
.b{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;height:76px;border-radius:32px;font-size:20px;font-weight:700;margin-top:14px;cursor:pointer;border:2px solid transparent;font-family:inherit}
.b svg{width:28px;height:28px}
.b.dark{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 12px 24px -10px rgba(8,145,166,.6)}
.b.light{background:#fff;color:var(--pri2);border-color:var(--bd)}
.b:active{transform:scale(.98)}
.b:disabled{opacity:.5}
input[type=file]{display:none}
.msg{font-size:14px;margin-top:10px;min-height:18px}
.msg.err{color:var(--err)}.msg.ok{color:var(--ok)}
.hide{display:none!important}
.spin{width:54px;height:54px;border:5px solid var(--bd);border-top-color:var(--pri);border-radius:50%;animation:s 1s linear infinite;margin-bottom:20px}
@keyframes s{to{transform:rotate(360deg)}}
.sub{color:var(--mut);font-size:17px;margin:0}
.rcard{background:var(--soft);border:1px solid var(--bd);border-radius:28px;padding:26px 18px;text-align:center;margin-top:8px}
.rcard .l{color:var(--mut);font-size:15px}
.rcard .v{font-size:46px;font-weight:800;margin:6px 0;letter-spacing:-1px;color:var(--pri2)}
.rcard .f{color:var(--mut);font-size:15px}
.det{background:#fff;border:1px solid var(--bd);border-radius:24px;padding:6px 18px;margin-top:14px}
.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--bd);font-size:16px}
.row:last-child{border:0}.row span:first-child{color:var(--mut)}.row span:last-child{font-weight:600;text-align:right}
#home{justify-content:space-between}
#home .center{padding-bottom:22vh}
.hero{width:min(250px,66vw);height:auto;margin-bottom:26px}
.ttl{font-size:30px;line-height:1.1;font-weight:800;margin:0 0 10px;letter-spacing:-.5px;color:#111729}
#home .btns{margin-top:0}
#splash{position:fixed;inset:0;z-index:99;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s ease,visibility .5s}
#splash.out{opacity:0;visibility:hidden}
#splash .logo{margin-bottom:28px;animation:pop .8s cubic-bezier(.2,1.4,.4,1) both}
#splash .bar{width:120px;height:4px;border-radius:4px;background:var(--bd);margin-top:6px;overflow:hidden}
#splash .bar b{display:block;height:100%;width:0;background:var(--pri);border-radius:4px;animation:fill 1.9s ease-in-out .3s forwards}
@keyframes pop{from{transform:scale(.3) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
@keyframes fill{to{width:100%}}
.keybox{background:var(--soft);border:1px solid var(--bd);border-radius:24px;padding:18px}
.keybox label{font-size:14px;color:var(--mut);display:block;margin-bottom:8px}
.keybox input{width:100%;height:52px;border-radius:16px;border:1.5px solid var(--bd);background:#fff;color:var(--tx);padding:0 14px;font-size:16px}
.link{background:none;border:0;color:var(--mut);font-size:14px;margin:16px auto 0;display:block;text-decoration:underline;cursor:pointer}
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <svg class="logo" viewBox="0 0 96 96" fill="none">
    <rect x="10" y="6" width="76" height="84" rx="20" fill="#fff"/>
    <rect x="22" y="18" width="52" height="20" rx="8" fill="#0891b2"/>
    <g fill="#0891b2"><circle cx="30" cy="52" r="5"/><circle cx="48" cy="52" r="5"/><circle cx="66" cy="52" r="5"/>
    <circle cx="30" cy="70" r="5"/><circle cx="48" cy="70" r="5"/><circle cx="66" cy="70" r="5" opacity=".6"/></g>
  </svg>
  <div class="bar"><b></b></div>
</div>

    <h1 class="ttl">Leitor de Gratuidade</h1>
    <p class="sub">Contator inteligente</p>
  </div>

  <div class="btns">
    <div class="keybox hide" id="keybox">
      <label for="key">Chave da API do Gemini</label>
      <input type="password" id="key" placeholder="Cole a chave aqui" autocomplete="off">
      <button class="b dark" id="saveKey" style="height:56px;font-size:17px;margin-top:12px">Testar e salvar</button>
      <div class="msg" id="kmsg"></div>
    </div>

    <div id="actions">
      <label class="b dark" for="cam">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L8 6H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3.5"/></svg>
        Tirar foto
      </label>
      <input type="file" id="cam" accept="image/*" capture="environment">
      <label class="b light" for="gal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>
        Abrir da galeria
      </label>
      <input type="file" id="gal" accept="image/*">
      <div class="msg err" id="err" style="text-align:center"></div>
    </div>

  </div>
</div>

<!-- CARREGANDO -->
<div class="screen" id="load">
  <div class="center"><div class="spin"></div><p class="sub">Lendo a filipeta…</p></div>
</div>

<!-- RESULTADO -->
<div class="screen" id="out">
  <div style="flex:1">
    <div class="rcard">
      <div class="l">Valor das gratuidades</div>
      <div class="v" id="total"></div>
      <div class="f" id="formula"></div>
    </div>
    <div class="det">
      <div class="row"><span>Venda a bordo</span><span id="vb"></span></div>
      <div class="row"><span>Tarifa</span><span id="tar"></span></div>
      <div class="row"><span>Quantidades (0,00)</span><span id="qtd"></span></div>
    </div>
  </div>
  <button class="b light" id="seeNow">Ver Filipeta</button>
  <button class="b dark" id="again">Reiniciar</button>
</div>

<!-- VISUALIZADOR -->
<div class="screen" id="viewer">
  <div style="flex:1;display:flex;align-items:center;justify-content:center;overflow:auto">
    <img id="slip" alt="Filipeta lida" style="max-width:100%;border-radius:20px;border:1px solid var(--bd)">
  </div>
  <button class="b dark" id="closeView">Voltar</button>
</div>

<script>
const $=id=>document.getElementById(id);
const MODEL='gemini-3.5-flash-lite';
const URL_=k=>`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${encodeURIComponent(k)}`;
const brl=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let API=store.get('gk')||'';

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id))}
setTimeout(()=>$('splash').classList.add('out'),2400);


function refreshKeyUI(){
  const has=!!API;
  $('keybox').classList.toggle('hide',has);
  $('actions').classList.toggle('hide',!has);
}
refreshKeyUI();
$('saveKey').onclick=async()=>{
  const k=$('key').value.trim(),m=$('kmsg');
  if(!k){m.className='msg err';m.textContent='Cole a chave.';return}
  $('saveKey').disabled=true;m.className='msg';m.textContent='Testando…';
  try{
    const r=await fetch(URL_(k),{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{parts:[{text:'Responda apenas: ok'}]}]})});
    const j=await r.json();
    if(!r.ok)throw new Error(j.error?.message||'Chave inválida');
    API=k;store.set('gk',k);
    m.className='msg ok';m.textContent='Chave funcionando ✓';
    setTimeout(()=>{$('key').value='';m.textContent='';refreshKeyUI()},900);
  }catch(e){m.className='msg err';m.textContent=e.message}
  $('saveKey').disabled=false;
};

/* imagem */
function compress(file,max=1280,q=.7){
  return new Promise((ok,no)=>{
    const img=new Image(),u=URL.createObjectURL(file);
    img.onload=()=>{
      const s=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(u);c.toBlob(bl=>ok({b64:c.toDataURL('image/jpeg',q).split(',')[1],blob:bl}),'image/jpeg',q);
    };
    img.onerror=()=>no(new Error('Imagem inválida'));
    img.src=u;
  });
}

const PROMPT=`Você está lendo a foto de uma filipeta/comprovante impresso de passagens.
Extraia:
1) A linha "VENDA A BORDO": o valor entre parênteses (ex.: 150,65) e a quantidade na mesma linha (ex.: 23).
2) TODAS as linhas de itens que têm o valor (0,00) entre parênteses: o nome e a quantidade ao lado de cada uma, linha por linha.
Não calcule nada, apenas leia com exatidão. Use ponto como separador decimal.
Responda SOMENTE com o JSON, sem nenhum texto antes ou depois:
{"venda_a_bordo":{"valor":number,"quantidade":number},"gratuidades":[{"nome":string,"quantidade":number}]}`;

async function process(e){
  const f=e.target.files[0];e.target.value='';
  if(!f)return;
  $('err').textContent='';
  if(!API){$('err').textContent='Informe a chave da API do Gemini.';refreshKeyUI();return}
  show('load');
  try{
    const {b64}=await compress(f);
    lastSlip='data:image/jpeg;base64,'+b64;
    const r=await fetch(URL_(API),{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{parts:[{text:PROMPT},{inline_data:{mime_type:'image/jpeg',data:b64}}]}],
        generationConfig:{responseMimeType:'application/json'}})});
    const j=await r.json();
    if(!r.ok)throw new Error(j.error?.message||'Erro na API');
    const txt=j.candidates[0].content.parts.map(p=>p.text||'').join('').replace(/```json|```/g,'').trim();
    const d=JSON.parse(txt.slice(txt.indexOf('{'),txt.lastIndexOf('}')+1)),vb=d.venda_a_bordo;
    if(!vb||!vb.quantidade)throw new Error('Não achei a linha VENDA A BORDO. Tente outra foto.');
    const raw=vb.valor/vb.quantidade;
    const tarifa=Math.abs(raw-6.55)<=Math.abs(raw-6.40)?6.55:6.40;
    const lin=d.gratuidades||[];
    const qtd=lin.reduce((s,l)=>s+(Number(l.quantidade)||0),0);
    $('total').textContent=brl(qtd*tarifa);
    $('formula').textContent=`${qtd} × ${brl(tarifa)}`;
    $('vb').textContent=`${brl(vb.valor)} ÷ ${vb.quantidade} = ${raw.toFixed(3).replace('.',',')}`;
    $('tar').textContent=brl(tarifa);
    $('qtd').textContent=lin.length?`${lin.map(l=>l.quantidade).join(' + ')} = ${qtd}`:'0';
    show('out');
  }catch(er){if(/API key not valid|API_KEY_INVALID|API key expired/i.test(er.message||'')){API='';store.del('gk');refreshKeyUI()}
  $('err').textContent=(er.message||'Erro ao ler a foto');show('home')}
}
$('cam').addEventListener('change',process);
$('gal').addEventListener('change',process);
/* filipeta lida (só depois da leitura) */
let lastSlip='';
function openSlip(){if(!lastSlip)return;$('slip').src=lastSlip;show('viewer')}
$('seeNow').onclick=openSlip;
$('closeView').onclick=()=>show('out');
$('again').onclick=()=>{lastSlip='';$('slip').removeAttribute('src');location.reload()};
</script>
</body>
</html>
